name: Deploy to GitHub Pages

# Publishing is a deliberate act, not a side effect of merging. This workflow is
# manual-only (workflow_dispatch) so nothing reaches the public because a PR landed.
# Flip to `push: branches: [main]` once the site is live and you want that.
on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Public URL the site serves from, no trailing slash. A custom domain (https://yourname.com) is the recommended shape — shorter, no base_path, and it reads better next to your name."
        required: true
        default: "https://tjaiyen.github.io/bespoke-ux-portfolio"
      base_path:
        description: "Path component — ONLY for a Pages project site (e.g. /bespoke-ux-portfolio). Leave EMPTY for a custom domain, a user site, or Vercel."
        required: false
        default: "/bespoke-ux-portfolio"
      cname:
        description: "Custom domain, e.g. theerayutjaiyen.com. Writes the CNAME file Pages needs, without which the domain setting is dropped on the next deploy. Leave empty if you have no domain."
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # NEXT_PUBLIC_* is inlined at BUILD time. Setting it after the build does nothing —
      # which is precisely how a site ships with http://localhost:3000 in every og: tag,
      # its sitemap and its llms.txt while the build stays green.
      # `build:static` also runs scripts/finalize-export.mjs, which writes .nojekyll
      # (Pages runs Jekyll, which drops every path starting with an underscore — i.e. all
      # of _next/) and the CNAME file when a domain is given.
      - name: Build static export
        env:
          NEXT_PUBLIC_SITE_URL: ${{ inputs.site_url }}
          NEXT_PUBLIC_BASE_PATH: ${{ inputs.base_path }}
          NEXT_PUBLIC_CNAME: ${{ inputs.cname }}
        run: npm run build:static

      # The gate that makes the env vars above non-optional. It reads the exported bytes,
      # not the source, and fails the deploy on localhost leakage, asset URLs that will
      # 404 under the deploy path, an unfilled NDA blocklist, or a missing contact route.
      - name: Pre-publish gate
        run: npm run check:publish -- --base "${{ inputs.site_url }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
