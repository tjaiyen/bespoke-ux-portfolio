# Phase 1 CI skeleton — deliberately a SUBSET of the canonical pipeline.
# Grows into 04-Schemas/Schema-GitHub-Actions-YML.md (vault) by Phase 5: NDA blocklist scan,
# opt-in claude -p review, pa11y-ci, and the Lighthouse budget get added at their phase gates.
# CI exists from the FIRST commit on purpose (risk R12) — a pipeline bolted on in Phase 5
# misses every violation introduced before it.
name: Portfolio Quality & Security Assurance

on: [pull_request]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      # Contrast is computed from the token values in globals.css — no browser, no
      # server, deterministic. Runs before the server steps because it needs neither.
      - name: Contrast audit (WCAG 1.4.3 / 1.4.11, both themes)
        run: npm run a11y:contrast
      - name: Start server
        run: npm start &
      - name: Wait for server
        run: npx wait-on http://localhost:3000 --timeout 60000
      # PA11Y_CHROME_PATH points at the browser the runner already provides. Puppeteer's
      # bundled download has been observed to truncate silently, reporting success while
      # leaving a stub that dies on launch — pinning to a known-good binary avoids that.
      - name: Accessibility audit (pa11y-ci, all routes)
        env:
          PA11Y_CHROME_PATH: ${{ env.CHROME_PATH }}
        run: npm run a11y:pa11y
      - name: Keyboard, focus & viewport audit (tier 2)
        env:
          PA11Y_CHROME_PATH: ${{ env.CHROME_PATH }}
        run: npm run a11y:keyboard
